name: Testsuite
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        id: install

      - name: Lint
        run: helm lint .

      # Regression guard for #158: a TLS secret configured without the matching
      # security realm's serverIdentities.ssl must fail rendering (template-only,
      # no cluster needed).
      - name: Validate fail-fast on incomplete TLS config
        run: |
          set -u
          expect_fail() {
            local desc="$1"; shift
            local pattern="$1"; shift
            local out
            if out=$(helm template x . "$@" 2>&1); then
              echo "❌ $desc: expected rendering to fail, but it succeeded"
              exit 1
            fi
            if ! echo "$out" | grep -q "$pattern"; then
              echo "❌ $desc: failed for the wrong reason"
              echo "$out"
              exit 1
            fi
            echo "✅ $desc: failed as expected"
          }
          expect_fail "endpoint secret without default-realm ssl" \
            'the "default" security realm has no serverIdentities.ssl' \
            --set deploy.ssl.endpointSecretName=tls-secret
          expect_fail "transport secret without cluster-transport-realm ssl" \
            'the "cluster-transport" security realm has no serverIdentities.ssl' \
            --set deploy.ssl.transportSecretName=tls-transport-secret
          # Sanity: a fully configured chart still renders.
          helm template x . -f values.yaml -f test/tls_values.snippet.yaml >/dev/null
          echo "✅ complete TLS config renders"

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.25.16

      - name: Display cluster settings
        run: |
          kubectl cluster-info
          kubectl get pods -n kube-system
          echo "current-context:" $(kubectl config current-context)
          echo "environment-kubeconfig:" ${KUBECONFIG}

      - name: Testing
        run: |
            kubectl create namespace helm-test
            helm install example-infinispan . -n helm-test --set deploy.replicas=2
            kubectl -n helm-test rollout status --watch --timeout=300s statefulset/example-infinispan
            helm uninstall example-infinispan -n helm-test
            kubectl delete namespace helm-test

      - name: Testing TLS
        run: |
            kubectl create namespace helm-test
            kubectl apply -f test/tls_secret.yaml -n helm-test
            kubectl apply -f test/transport_tls_secret.yaml -n helm-test
            helm install example-infinispan . -n helm-test -f values.yaml -f test/tls_values.snippet.yaml --set deploy.replicas=2
            kubectl -n helm-test rollout status --watch --timeout=300s statefulset/example-infinispan
            helm uninstall example-infinispan -n helm-test
            kubectl delete namespace helm-test

      - name: Install cert-manager
        run: |
            kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.2/cert-manager.yaml
            kubectl -n cert-manager rollout status --watch --timeout=120s deployment/cert-manager
            kubectl -n cert-manager rollout status --watch --timeout=120s deployment/cert-manager-webhook
            kubectl -n cert-manager rollout status --watch --timeout=120s deployment/cert-manager-cainjector

      - name: Testing cert-manager TLS
        run: |
            kubectl create namespace helm-test
            helm install example-infinispan . -n helm-test -f values.yaml -f test/certmanager_tls_values.snippet.yaml --set deploy.replicas=2
            kubectl -n helm-test wait --for=condition=Ready certificate/example-infinispan-endpoint-cert --timeout=120s
            kubectl -n helm-test rollout status --watch --timeout=300s statefulset/example-infinispan
            helm uninstall example-infinispan -n helm-test
            kubectl delete namespace helm-test
