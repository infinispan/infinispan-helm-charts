deploy:
  security:
    batch: |-
      credentials add keystore -c changeit -p secret --path="credentials.pfx" #<1>
  infinispan:
    server:
      security:
        credentialStores:
          - name: credentials
            path: credentials.pfx
            clearTextCredential:
              clearText: "secret"
        securityRealms:
          - name: default
            serverIdentities:
              ssl:
                keystore:
                  path: "/etc/encrypt/endpoint/keystore.p12" #<2>
                  alias: "1" #<3>
                  credentialReference:
                    store: credentials
                    alias: keystore #<4>
